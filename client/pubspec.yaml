name: password_manager
description: ByteLocker, a private self-hosted password manager for Android and Windows.
publish_to: none
version: 0.3.1+7
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter_svg: 2.3.0
  cryptography: 2.9.0
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
